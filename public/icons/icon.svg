<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed, glyph inside the central safe zone, so the same art works
       as an ordinary icon and as a maskable one that Android crops to a
       circle or squircle. Source for the PNGs beside it. Indigo to violet,
       matching the brand mark in the app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="136" y="150" width="240" height="224" rx="36" fill="#ffffff"/>
  <rect x="136" y="150" width="240" height="68" rx="36" fill="#e0e7ff"/>
  <rect x="136" y="186" width="240" height="32" fill="#e0e7ff"/>
  <rect x="184" y="120" width="26" height="60" rx="13" fill="#312e81"/>
  <rect x="302" y="120" width="26" height="60" rx="13" fill="#312e81"/>
  <g fill="#4f46e5">
    <circle cx="196" cy="266" r="17"/>
    <circle cx="256" cy="266" r="17"/>
    <circle cx="316" cy="266" r="17" opacity="0.35"/>
    <circle cx="196" cy="324" r="17" opacity="0.35"/>
    <circle cx="256" cy="324" r="17"/>
    <circle cx="316" cy="324" r="17"/>
  </g>
</svg>
