  <rect x="136" y="186" width="240" height="32" fill="#1e40af"/>
  <rect x="184" y="120" width="26" height="60" rx="13" fill="#e5e7eb"/>
  <rect x="302" y="120" width="26" height="60" rx="13" fill="#e5e7eb"/>
  <g fill="#ffffff">
