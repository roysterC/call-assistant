# Production deploy for the DOAI Call Assistant.
#
# Target topology is documented in README.md ("Deployment"). The short version:
# production is the netcup box, NOT the Hetzner box this workflow used to ship
# to. See the `env:` block below before changing anything here.
name: Deploy to netcup

on:
  push:
    branches: [master]
  # Manual trigger, so a deploy can be re-run after fixing the box without
  # having to push an empty commit.
  workflow_dispatch:

# One production deploy at a time. Two overlapping runs would interleave
# `npm ci`, `prisma db push` and `systemctl restart` on the same working tree.
# Queue rather than cancel: a half-finished deploy is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Host facts are kept here in plain sight rather than in repository secrets.
#
# The previous version of this workflow read its target from ${{ secrets.VPS_HOST }},
# so nothing in the repo said which machine "production" meant. It went on
# deploying to a decommissioned Hetzner box long after the app had moved, and
# nobody could see that by reading the file. A hostname is not a credential;
# only the SSH key below is.
env:
  DEPLOY_HOST: v2202609416356518198.megasrv.de # netcup, 89.58.45.110
  DEPLOY_USER: root
  APP_USER: deploy # owns APP_DIR and runs the service
  APP_DIR: /home/deploy/call-assistant
  SERVICE: call-assistant.service
  # The app is built here on GitHub, not on the box. Building on the 3.8GB
  # box alongside Postgres, the live app and the voice server stopped
  # fitting: one deploy was killed for memory, the next froze until the
  # 30-minute limit, and the live site slowed while they ran. The runner
  # has room to spare; the box only unpacks the result and restarts.
  BUILD_HEAP_MB: "6144"
  # What the build reads from the box's .env and bakes in: the browser's
  # error reporting, the voice server's address (in the security headers),
  # the app's and booking addresses, and Sentry's source-map upload. Read
  # over SSH at build time, so the box stays the one place they are set.
  BUILD_ENV_KEYS: "NEXT_PUBLIC_[A-Z0-9_]+|RECEPTIONIST_VOICE_URL|BOOKING_URL|AUTH_URL|SENTRY_ORG|SENTRY_PROJECT|SENTRY_AUTH_TOKEN"

jobs:
  # Fail fast on the runner, before anything touches production.
  #
  # The three checks run side by side, one job each; the deploy waits for all
  # of them, and the first to fail cancels the rest. The build is the deploy
  # job's own first step, so a broken build still stops before the box.
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [typecheck, lint, test]
    name: checks (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # node_modules itself, not just npm's download cache: restoring it takes
      # seconds, where `npm ci` took a minute every run. Keyed on the lockfile
      # and Node, so any change to either installs afresh.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Set up SSH to the box
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,rsa -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host box\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      # Only the keys in BUILD_ENV_KEYS, each file kept apart so .env.local
      # still wins over .env as it does on the box. Values are masked in the
      # log; the files live only on this runner and are never uploaded.
      - name: Read the build settings from the box
        run: |
          for f in .env .env.local; do
            ssh box "grep -E '^(${BUILD_ENV_KEYS})=' '$APP_DIR/$f' 2>/dev/null || true" > "$f"
            while IFS= read -r line; do
              value="${line#*=}"; value="${value%\"}"; value="${value#\"}"
              [ -n "$value" ] && echo "::add-mask::$value"
            done < "$f"
            echo "$f: $(cut -d= -f1 "$f" | tr '\n' ' ')"
          done

      - name: Build
        run: NODE_OPTIONS=--max-old-space-size=${BUILD_HEAP_MB} npm run build

      # The build without its cache, named for the commit, so the box can
      # never unpack one commit's build over another's code.
      - name: Copy the build to the box
        run: |
          tar -czf next-build.tgz --exclude=.next/cache --exclude=.next/dev .next
          ls -lh next-build.tgz
          scp -q next-build.tgz "box:/tmp/next-build-${GITHUB_SHA}.tgz"

      - name: Deploy to netcup over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          script_stop: true
          # Up to ten minutes waiting for voice calls to finish before the
          # voice server is restarted, and room for the rest.
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR='${{ env.APP_DIR }}'
            APP_USER='${{ env.APP_USER }}'
            SERVICE='${{ env.SERVICE }}'
            # The commit this run built: the box checks out exactly that,
            # not whatever master is by now, so code and build always match.
            SHA='${{ github.sha }}'
            BUILD_TGZ="/tmp/next-build-${SHA}.tgz"
            # Gone when this run ends, whether it succeeds or not.
            trap 'rm -f "$BUILD_TGZ"' EXIT

            # Login is root, but the working tree and the service both belong to
            # `deploy`. Everything that touches the tree therefore runs as
            # `deploy` rather than configuring safe.directory for root: if root
            # wrote here, it would leave root-owned files in node_modules/ and
            # .next/ that the next deploy (and the service itself) could not
            # overwrite. -H so npm uses deploy's HOME and cache.
            as_deploy() {
              sudo -u "$APP_USER" -H bash -lc "cd '$APP_DIR' && $*"
            }

            echo "==> Deploying to $(hostname) as $APP_USER in $APP_DIR"

            # Prisma reads DATABASE_URL through prisma.config.ts, which loads
            # .env.local then .env from the app directory. Checked up front so a
            # missing env file is a one-line error here rather than a confusing
            # Prisma failure three steps later.
            if ! as_deploy 'test -f .env.local -o -f .env'; then
              echo "ERROR: neither .env.local nor .env found in $APP_DIR." >&2
              echo "Prisma and Next both read DATABASE_URL from there." >&2
              exit 1
            fi

            # Git is the source of truth for this box. reset --hard rather than
            # pull: a merge or a rebase on a deploy target is never what anyone
            # wants, and this recovers a tree someone has poked at by hand.
            # Untracked files (.env.local in particular) are not touched.
            if [ ! -s "$BUILD_TGZ" ]; then
              echo "ERROR: the build for $SHA is not on the box ($BUILD_TGZ)." >&2
              exit 1
            fi

            echo "==> Fetching $SHA"
            as_deploy "git fetch origin master && git reset --hard $SHA"

            # Installed afresh only when the lockfile or Node has changed since
            # the last install: most deploys change neither, and `npm ci` took
            # most of a minute, wiping node_modules under the running service
            # while it did. The stamp is written after a good install, inside
            # node_modules, so a failed or partial install is never mistaken
            # for a current one.
            echo "==> Installing dependencies"
            as_deploy 'want="$(node --version) $(sha256sum package-lock.json | cut -d" " -f1)"
              if [ -d node_modules ] && [ "$(cat node_modules/.deploy-installed 2>/dev/null)" = "$want" ]; then
                echo "    unchanged since the last install; skipped"
              else
                npm ci && printf "%s" "$want" > node_modules/.deploy-installed
              fi'

            echo "==> Generating Prisma client"
            as_deploy 'npm run prisma:generate'

            # --- Schema sync -------------------------------------------------
            #
            # `prisma db push` refuses anything it considers lossy unless given
            # --accept-data-loss, and that flag is all-or-nothing: it would wave
            # through a DROP COLUMN just as readily as the added unique
            # constraint that broke the last three runs of the old workflow.
            #
            # So the diff is inspected first. If the SQL that would bring prod
            # up to the committed schema is purely additive, the push runs with
            # the flag. If it drops or narrows anything, the deploy stops and
            # prints the SQL for a human to apply deliberately.
            #
            # This is a guard, not a proof: db push recomputes its own plan, so
            # treat it as "nothing destructive was pending a moment ago". Adding
            # a unique constraint over existing duplicates still fails — but it
            # fails on the Postgres index build, which changes nothing.
            echo "==> Checking for schema drift"
            SCHEMA_SQL="$(as_deploy 'npx prisma migrate diff --from-config-datasource --to-schema=prisma/schema.prisma --script')"

            if printf '%s' "$SCHEMA_SQL" | grep -Eiq 'DROP[[:space:]]+(TABLE|COLUMN|SCHEMA|DATABASE)|SET[[:space:]]+NOT[[:space:]]+NULL|SET[[:space:]]+DATA[[:space:]]+TYPE|TRUNCATE'; then
              echo "ERROR: refusing to apply a destructive schema change automatically." >&2
              echo "Pending SQL:" >&2
              printf '%s\n' "$SCHEMA_SQL" >&2
              echo >&2
              echo "Apply it by hand on the box, or split it into the two-commit" >&2
              echo "dance (ship code that stops reading the column, then drop it)." >&2
              exit 1
            fi

            echo "==> Syncing schema (additive only)"
            as_deploy 'npx prisma db push --accept-data-loss'

            # The build made on GitHub, unpacked beside the live one: the
            # service keeps serving the old build until the switch just
            # before the restart. The previous build is kept as .next-previous
            # (moved back by hand to roll back) until the next deploy.
            # A build left from the days the box built for itself can outlive
            # its deploy (a run that timed out ends the SSH session, not the
            # build) and would go on writing into .next. Stopped first.
            if pkill -u "$APP_USER" -f 'next build'; then
              echo "==> Stopped a leftover build on the box"
              sleep 2
            fi

            echo "==> Unpacking the build"
            chmod 644 "$BUILD_TGZ"
            as_deploy "rm -rf .next-incoming && mkdir .next-incoming && tar -xzf '$BUILD_TGZ' -C .next-incoming --strip-components=1"

            # Booking alerts' signing keys: made once on this box and kept in
            # .env (scripts/ensure-push-keys.ts). Before the restarts, so the
            # CRM and the voice server both start with them. Never fails the
            # deploy; the private key is never printed.
            echo "==> Checking booking alert keys"
            as_deploy 'npx tsx scripts/ensure-push-keys.ts' \
              || echo "WARNING: booking alert keys could not be checked; phones will get no alerts" >&2

            echo "==> Switching to the new build and restarting $SERVICE"
            as_deploy 'rm -rf .next-previous && { [ ! -d .next ] || mv .next .next-previous; } && mv .next-incoming .next'
            systemctl restart "$SERVICE"
            # Give it a moment to fall over before declaring success: a unit
            # that exits on boot would otherwise be reported as a green deploy.
            sleep 5
            systemctl is-active --quiet "$SERVICE" || {
              echo "ERROR: $SERVICE is not active after restart." >&2
              systemctl status "$SERVICE" --no-pager --lines=40 >&2 || true
              exit 1
            }

            # Idempotent data backfills for columns the schema push just added.
            # After the restart so nothing the old build wrote is missed; see
            # the header of scripts/post-deploy.ts.
            echo "==> Post-deploy backfills"
            as_deploy 'npx tsx scripts/post-deploy.ts'

            # The receptionist's voice server, once it has been installed (see
            # README: "Voice server"). Skipped until then, and never fails the
            # deploy: the CRM is already live by this point.
            #
            # A restart hangs up every call in progress, so it waits for them
            # to finish first: up to ten minutes, checking the server's own
            # count. Still busy after that, it is left running the old code
            # and the next deploy restarts it. An unreachable server counts as
            # no calls, so a crashed one is always restarted.
            VOICE_SERVICE=call-assistant-voice
            voice_calls() {
              # Always prints exactly one number and always succeeds: this
              # runs under set -euo pipefail, where a failed curl would
              # otherwise end the deploy.
              { curl -fsS -m 5 http://127.0.0.1:4610/voice/health 2>/dev/null || true; } \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let n=0;try{const h=JSON.parse(s);n=h.activeCalls??h.labCalls??0}catch{}console.log(Number(n)||0)})'
            }
            if systemctl cat "$VOICE_SERVICE" >/dev/null 2>&1; then
              waited=0
              calls=$(voice_calls)
              while [ "$calls" -gt 0 ] && [ "$waited" -lt 600 ]; do
                echo "==> $calls call(s) in progress on $VOICE_SERVICE; waiting before restarting it"
                sleep 15
                waited=$((waited + 15))
                calls=$(voice_calls)
              done
              if [ "$calls" -gt 0 ]; then
                echo "WARNING: $VOICE_SERVICE still has $calls call(s) after 10 minutes; left running. The next deploy restarts it." >&2
              else
                echo "==> Restarting $VOICE_SERVICE"
                systemctl restart "$VOICE_SERVICE" || echo "WARNING: $VOICE_SERVICE did not restart" >&2
              fi
            fi

            # Day-before reminder texts: a timer that asks the CRM to send
            # them (deploy/call-assistant-reminders.*). Copied in on every
            # deploy so a change to the schedule ships like any other code.
            # Never fails the deploy: the CRM is already live by this point.
            echo "==> Installing the reminder timer"
            if cp "$APP_DIR/deploy/call-assistant-reminders.service" "$APP_DIR/deploy/call-assistant-reminders.timer" /etc/systemd/system/ \
              && systemctl daemon-reload \
              && systemctl enable --now call-assistant-reminders.timer; then
              echo "    next run: $(systemctl show -p NextElapseUSecRealtime --value call-assistant-reminders.timer)"
            else
              echo "WARNING: the reminder timer could not be installed; no reminder texts will go" >&2
            fi
            # Says so if the box cannot send them, rather than leaving it to
            # the first morning nobody gets a text.
            reminders=$(curl -fsS -m 10 http://127.0.0.1:3000/api/cron/appointment-reminders 2>/dev/null || true)
            case "$reminders" in
              *'"cronSecretSet":true'*) ;;
              *) echo "WARNING: CRON_SECRET is not set in $APP_DIR/.env; the reminder timer will be refused" >&2 ;;
            esac
            case "$reminders" in
              *'"smsConfigured":true'*) ;;
              *) echo "WARNING: Twilio is not configured; reminders cannot be texted" >&2 ;;
            esac

            # Nightly encrypted database backup, sent off-site
            # (deploy/call-assistant-backup.*, scripts/backup-db.sh). Installed
            # the same way, and never fails the deploy; it says what is
            # missing instead. Settings are checked by name only, never shown.
            echo "==> Installing the backup timer"
            if cp "$APP_DIR/deploy/call-assistant-backup.service" "$APP_DIR/deploy/call-assistant-backup.timer" /etc/systemd/system/ \
              && systemctl daemon-reload \
              && systemctl enable --now call-assistant-backup.timer; then
              echo "    next run: $(systemctl show -p NextElapseUSecRealtime --value call-assistant-backup.timer)"
            else
              echo "WARNING: the backup timer could not be installed; the database is not being backed up" >&2
            fi
            for tool in pg_dump pg_restore gpg rclone; do
              command -v "$tool" >/dev/null 2>&1 || echo "WARNING: $tool is not installed; backups will fail (README: \"Backups\")" >&2
            done
            for setting in BACKUP_PASSPHRASE BACKUP_REMOTE; do
              as_deploy "grep -qsE '^${setting}=.+' .env .env.local" \
                || echo "WARNING: $setting is not set in $APP_DIR/.env; backups will fail (README: \"Backups\")" >&2
            done
            backup=$(curl -fsS -m 10 http://127.0.0.1:3000/api/health/backups 2>/dev/null || true)
            case "$backup" in
              *'"status":"ok"'*) echo "    last off-site backup: fine" ;;
              *) echo "WARNING: no off-site backup in the last 26 hours" >&2 ;;
            esac

            echo "==> Deploy complete: $(systemctl show -p ActiveState --value "$SERVICE")"
